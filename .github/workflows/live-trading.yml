# Daily live paper trading: runs the agents in live/config.json on real-time prices and commits
# their state (accounts, journals, learned models, research) back to the repo; the dashboard reads it.
name: Live trading

on:
  schedule:
    - cron: "45 14 * * *"    # daily decision (NYSE open; weekends/holidays are skipped by the runner)
    - cron: "45 19 * * 1-5"  # mark to market before the New York close
    - cron: "15 2 * * *"     # overnight mark (crypto trades 24/7)
    - cron: "20 * * * *"     # hourly research: news + Claude analysis, macro, calendar, patterns
  workflow_dispatch:
    inputs:
      mode:
        description: "decide = daily decision, mark = valuation only, research = news/macro/calendar refresh"
        type: choice
        options: [mark, decide, research]
        default: mark

permissions:
  contents: write

concurrency:
  group: live-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[yfinance,crypto,alpaca,llm]"

      - name: Choose mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "45 14 * * *") MODE=decide ;;
              "20 * * * *") MODE=research ;;
              *) MODE=mark ;;
            esac
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      - name: Run agents
        env:
          # Optional: Alpaca keys give real bid/ask for stocks (free paper account). Without them Yahoo is used.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Optional AI engines for news analysis and the discretionary agent. All optional: without them the
          # free local engine does the work. Free keys (no card): Google AI Studio (Gemini) and Groq.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Claude is paid (Anthropic API); only used if this secret exists.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Real money stays disabled unless the repository variable TRADESIM_ALLOW_LIVE is set to 1.
          TRADESIM_ALLOW_LIVE: ${{ vars.TRADESIM_ALLOW_LIVE }}
        run: python scripts/live_run.py --mode "$MODE"

      - name: Commit state
        if: always()
        run: |
          git config user.name "tradesim-bot"
          git config user.email "tradesim-bot@users.noreply.github.com"
          git add live dashboard/live.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "live: $MODE run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
